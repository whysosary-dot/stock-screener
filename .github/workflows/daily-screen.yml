name: daily-screen
# 평일 16:30 KST KOSPI/KOSDAQ 전종목 스크리닝 + 1개월 추세 스캔. 공휴일은 스크립트가 감지해 스킵.
# GitHub cron 은 정각·30분 슬롯이 가장 혼잡해 수 시간 밀리거나 누락된다(2026-10-21~26: 매일 5시간 지연, 10/26 누락).
# → 어중간한 분으로 3슬롯(16:37 / 17:13 / 18:41 KST). 같은 날 파일 덮어쓰기라 중복 실행 무해.
# 그래도 안 돌면 stock-valuation 리포의 screener-watchdog 워크플로가 17:52·19:23·21:47 KST 에 확인 후 workflow_dispatch 로 발동.
on:
  schedule:
    - cron: '37 7 * * 1-5'
    - cron: '13 8 * * 1-5'
    - cron: '41 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-screen
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests beautifulsoup4
      - name: daily_screen.py (collect → enrich → build·push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORK: ${{ runner.temp }}/scrwork
        run: |
          mkdir -p "$WORK"
          python3 scripts/daily_screen.py --step collect 2>&1 | tail -5
          if grep -q '"holiday": true' "$WORK/ckpt.json" 2>/dev/null; then echo "휴장일 — 종료"; exit 0; fi
          for i in 1 2 3 4 5 6 7 8; do
            out=$(python3 scripts/daily_screen.py --step enrich --budget 170 2>&1 | tail -3); echo "$out"
            echo "$out" | grep -q ENRICH_DONE && break
          done
          python3 scripts/daily_screen.py --step build 2>&1 | tail -20
      - name: swing_scan.py (1개월 추세)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 swing_scan.py 2>&1 | tail -12
