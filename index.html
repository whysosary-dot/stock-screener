<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 KOSPI/KOSDAQ 일일 스크리닝 리포트</title>

<!-- PWA / 홈화면 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=6">
<link rel="manifest" href="manifest.json?v=6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="급등스크리닝">
<meta name="theme-color" content="#0c1445">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:linear-gradient(180deg,#e8ecf1 0%,#dbe4f0 100%);
  color:#0c1445;min-height:100vh;display:flex;justify-content:center;
  padding:40px 20px
}
.wrap{
  max-width:840px;width:100%;background:#fff;border-radius:16px;
  box-shadow:0 4px 24px rgba(12,20,69,0.10);
  padding:40px 48px 36px;display:flex;flex-direction:column
}
.header{
  text-align:center;padding-bottom:24px;margin-bottom:0;
  border-bottom:3px solid #0c1445
}
.header h1{font-size:26px;font-weight:900;color:#0c1445;letter-spacing:-0.5px}
.header p{font-size:13px;color:#475569;margin-top:8px;line-height:1.6}
.stats{display:flex;justify-content:center;gap:18px;margin-top:14px;flex-wrap:wrap}
.stat{
  background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;
  padding:6px 12px;font-size:11px;color:#1e3a8a;font-weight:600
}
.stat b{font-family:Inter;color:#0c1445;font-size:13px}

/* 탭 */
.tabs{display:flex;gap:0;margin:24px 0 0 0;border-bottom:2px solid #e2e8f0}
.tab-btn{
  background:none;border:none;cursor:pointer;
  padding:10px 22px;font-size:14px;font-weight:700;color:#64748b;
  border-bottom:3px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;
  font-family:'Noto Sans KR',sans-serif;
}
.tab-btn:hover{color:#0c1445}
.tab-btn.active{color:#0c1445;border-bottom-color:#0c1445}
.tab-panel{display:none;padding-top:20px}
.tab-panel.active{display:block}

/* 리포트 목록 */
.item{
  display:flex;align-items:center;justify-content:space-between;
  background:#f6f8fa;border:1px solid #e2e8f0;border-radius:8px;
  padding:14px 18px;margin-bottom:10px;
  text-decoration:none;color:inherit;
  transition:background .2s,border-color .2s,box-shadow .2s
}
.item:hover{background:#f8fafc;border-color:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,0.10)}
.item.new{border-left:3px solid #dc2626}
.item-date{font-size:15px;font-weight:700;color:#0c1445}
.item-sub{font-size:11px;color:#64748b;margin-top:3px;line-height:1.5}
.badge-new{background:#dc2626;color:#fff;font-size:9px;font-weight:800;padding:2px 8px;border-radius:4px;letter-spacing:.5px}
.badge-link{color:#1e3a8a;font-size:12px;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px}
.item-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.2px}
.tag.up{background:#fee2e2;color:#b91c1c}
.tag.down{background:#dbeafe;color:#1d4ed8}
.tag.filter{background:#f1f5f9;color:#475569}

/* 즐겨찾기 */
.fav-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.fav-count{font-size:13px;color:#64748b}
.fav-clear-btn{background:none;border:1px solid #fca5a5;color:#ef4444;font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.fav-clear-btn:hover{background:#fef2f2}
.fav-card{
  display:flex;flex-direction:column;
  background:#fffbeb;border:1px solid #fde68a;border-radius:10px;
  padding:14px 18px;margin-bottom:10px;gap:8px;
}
.fav-card:hover{background:#fef9c3;border-color:#f59e0b}
.fav-card-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:10px;flex-wrap:wrap}
.fav-info{flex:1;min-width:0}
.fav-name{font-size:16px;font-weight:800;color:#0c1445;text-decoration:none}
.fav-meta{font-size:12px;color:#78716c;margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fav-sig{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#dcfce7;color:#166534}
.fav-sig.down{background:#fee2e2;color:#991b1b}
.fav-sig.neutral{background:#f1f5f9;color:#475569}
.fav-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.fav-link{background:#0c1445;color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:7px;text-decoration:none;white-space:nowrap}
.fav-link:hover{background:#1e3a8a}
.fav-link.naver{background:#03c75a}
.fav-link.dart{background:#475569}
.fav-remove{background:none;border:1.5px solid #fca5a5;color:#ef4444;font-size:16px;padding:5px 8px;border-radius:7px;cursor:pointer;line-height:1}
.fav-remove:hover{background:#fee2e2}
.fav-memo{
  width:100%;padding:6px 10px;
  border:1px solid #e2e8f0;border-radius:8px;
  font-size:12px;font-family:'Noto Sans KR',sans-serif;color:#374151;background:#fafafa;
  resize:none;outline:none;line-height:1.5;min-height:34px;box-sizing:border-box;
}
.fav-memo:focus{border-color:#3b82f6;background:#fff}
.fav-memo::placeholder{color:#cbd5e1}
.fav-empty{text-align:center;padding:48px 20px;color:#94a3b8;font-size:14px;line-height:1.8}
.fav-empty .big{font-size:40px;margin-bottom:12px}
.date-section-label{font-size:12px;font-weight:700;color:#94a3b8;margin:16px 0 8px 2px;letter-spacing:.3px}

.footer{text-align:center;margin-top:24px;font-size:10px;color:#94a3b8;line-height:1.6}
.footer a{color:#3b82f6;text-decoration:none}

@media(max-width:640px){
  body{padding:16px 12px}
  .wrap{padding:24px 20px}
  .header h1{font-size:20px}
  .item{padding:12px 14px}
  .tab-btn{padding:10px 14px;font-size:13px}
  .fav-card{padding:12px 14px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <h1>📈 KOSPI/KOSDAQ 일일 스크리닝</h1>
  <p>매일 장마감 후 거래대금 1,000억 이상 전종목 등락률·수익률 자동 집계</p>
  <div class="stats">
    <div class="stat">📅 발행 <b id="stat-count">-</b>회</div>
    <div class="stat">💰 거래대금 1,000억 이상</div>
    <div class="stat">📈 1·2·3개월 수익률</div>
  </div>
</div>

<!-- 탭 -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('reports',this)">📋 일자별 리포트</button>
  <button class="tab-btn" id="fav-tab-btn" onclick="switchTab('favs',this)">⭐ 즐겨찾기 <span id="fav-tab-count" style="font-size:11px;background:#f59e0b;color:#fff;padding:1px 6px;border-radius:10px;margin-left:4px;"></span></button>
</div>

<!-- 리포트 목록 -->
<div class="tab-panel active" id="tab-reports">
  <div id="report-list"><div class="empty">불러오는 중…</div></div>
</div>

<!-- 즐겨찾기 -->
<div class="tab-panel" id="tab-favs">
  <div class="fav-toolbar">
    <div class="fav-count"><span id="fav-total">0</span>개 즐겨찾기</div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <input id="fav-search" type="text" placeholder="🔍 종목명 검색..." oninput="renderFavs()"
        style="padding:6px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;width:160px;"
        onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"/>
      <button class="fav-clear-btn" onclick="clearAllFavs()">🗑 전체 초기화</button>
      <button id="gh-settings-btn" title="GitHub PAT 설정" onclick="openPatModal()" style="padding:5px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:14px;">⚙️</button>
      <button id="gh-commit-btn" onclick="ghCommitFavs()" title="즐겨찾기를 GitHub에 저장 (모든 기기 동기화)" style="padding:5px 12px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer;font-size:13px;font-weight:600;">☁️ 커밋 &amp; 푸시</button>
    </div>
  </div>
  <div id="fav-list"></div>
</div>

<div class="footer">
  ⚠️ 자동 생성 리포트 — 투자 권유 아님. 매매 책임은 본인.<br>
  Data: <a href="https://finance.naver.com">네이버 금융</a> · <a href="https://dart.fss.or.kr">DART</a><br>
  <a href="https://github.com/whysosary-dot/stock-screener">GitHub Repository</a>
</div>

</div>

<!-- Toast -->
<div id="gh-toast" style="display:none;position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;color:#fff;font-size:14px;font-weight:600;z-index:9999;opacity:1;transition:opacity .4s;box-shadow:0 4px 16px rgba(0,0,0,.2)"></div>

<!-- PAT 설정 모달 -->
<div id="pat-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:28px 32px;width:420px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <h3 style="margin:0 0 8px;font-size:18px;font-weight:700;">🔑 GitHub PAT 설정</h3>
    <p style="margin:0 0 16px;font-size:13px;color:#64748b;">즐겨찾기·메모를 모든 기기에서 동기화하려면 Personal Access Token이 필요합니다.<br>repo 권한 포함 토큰을 입력하세요.</p>
    <input id="pat-input" type="password" placeholder="ghp_xxxxxxxxxxxx" style="width:100%;box-sizing:border-box;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:16px;" />
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button onclick="closePatModal()" style="padding:8px 18px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;cursor:pointer;font-size:14px;">취소</button>
      <button onclick="savePatAndClose()" style="padding:8px 18px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer;font-size:14px;font-weight:600;">저장</button>
    </div>
  </div>
</div>

<script>
/* ───────── localStorage 헬퍼 ───────── */
// v2 키: { date: { ticker: ... } } 중첩 구조 — 날짜별로 즐겨찾기/메모 분리
const LS_FAVS_V2 = 'screener_favs_v2';
const LS_META_V2 = 'screener_fav_meta_v2';
const LS_MEMOS_V2 = 'screener_fav_memos_v2';
const LS_FAVS_LEGACY = 'screener_favs';
const LS_META_LEGACY = 'screener_fav_meta';
const LS_MEMOS_LEGACY = 'screener_fav_memos';
// 호환성 alias (clearAllFavs에서 사용)
const LS_FAVS = LS_FAVS_V2;
const LS_META = LS_META_V2;
const LS_MEMOS = LS_MEMOS_V2;

function _readLS(k, def){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):def;}catch(e){return def;} }
function _writeLS(k, v){ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} }

function getAllFavs(){ return _readLS(LS_FAVS_V2, {}); }
function saveAllFavs(o){ _writeLS(LS_FAVS_V2, o); }
function getAllMeta(){ return _readLS(LS_META_V2, {}); }
function saveAllMeta(o){ _writeLS(LS_META_V2, o); }
function getAllMemos(){ return _readLS(LS_MEMOS_V2, {}); }
function saveAllMemos(o){ _writeLS(LS_MEMOS_V2, o); }

// 호환성: 인자 없는 getFavs는 모든 (date, ticker) 평면화한 dict 반환 (총 개수 카운트 등)
function getFavs(){
  var out = {};
  var all = getAllFavs();
  Object.keys(all).forEach(function(d){
    Object.keys(all[d]||{}).forEach(function(t){
      if(all[d][t]) out[d+'|'+t] = true;
    });
  });
  return out;
}
function getMeta(){ return {}; } // 단일 ticker 기준 사용처가 없도록 마이그레이션됨
function getMemos(){ return {}; }
function saveFavs(){} function saveMeta(){} function saveMemos(){}

function migrateLegacyFavsIfNeeded(){
  if(localStorage.getItem(LS_FAVS_V2) != null) return;
  var oldFavs = _readLS(LS_FAVS_LEGACY, {});
  var oldMeta = _readLS(LS_META_LEGACY, {});
  var oldMemos = _readLS(LS_MEMOS_LEGACY, {});
  var favsV2={}, metaV2={}, memosV2={};
  Object.keys(oldFavs).forEach(function(ticker){
    if(!oldFavs[ticker]) return;
    var d = (oldMeta[ticker] && oldMeta[ticker].date) || '날짜 미상';
    if(!favsV2[d]) favsV2[d]={};
    favsV2[d][ticker] = true;
    if(oldMeta[ticker]){
      if(!metaV2[d]) metaV2[d]={};
      metaV2[d][ticker] = oldMeta[ticker];
    }
    if(oldMemos[ticker]){
      if(!memosV2[d]) memosV2[d]={};
      memosV2[d][ticker] = oldMemos[ticker];
    }
  });
  saveAllFavs(favsV2);
  saveAllMeta(metaV2);
  saveAllMemos(memosV2);
}
migrateLegacyFavsIfNeeded();

function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// DART autoSearch는 한글 raw 그대로일 때만 자동검색이 작동 → URL-special chars만 선택적 인코딩
function dartUrl(name){
  var safe = String(name||'').replace(/[&=?#+%"<>\s]/g, function(c){return '%'+c.charCodeAt(0).toString(16).toUpperCase();});
  return 'https://dart.fss.or.kr/dsab007/main.do?autoSearch=Y&option=corp&textCrpNm='+safe;
}

/* ───────── 탭 전환 ───────── */
function switchTab(id, btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='favs') renderFavs();
}

function updateFavCount(){
  var cnt = Object.keys(getFavs()).length;
  var el = document.getElementById('fav-tab-count');
  if(el) el.textContent = cnt>0 ? cnt : '';
  var tot = document.getElementById('fav-total');
  if(tot) tot.textContent = cnt;
}

/* ───────── 일자별 리포트 목록 ───────── */
async function loadReports(){
  var list = document.getElementById('report-list');
  try {
    var resp = await fetch('daily/index.json?t='+Date.now());
    if(!resp.ok) throw new Error('index.json 없음');
    var data = await resp.json();
    var dates = data.dates || [];
    document.getElementById('stat-count').textContent = dates.length;
    if(dates.length===0){
      list.innerHTML = '<div class="empty">발행된 리포트가 없습니다.</div>';
      return;
    }
    list.innerHTML = dates.map(function(r){
      var tags = '';
      if(r.limit_up>0) tags += '<span class="tag up">🚀 상한가 '+r.limit_up+'</span>';
      if(r.limit_down>0) tags += '<span class="tag down">💥 하한가 '+r.limit_down+'</span>';
      tags += '<span class="tag filter">필터통과 '+r.total_filtered+'</span>';
      return '<a class="item'+(r.new?' new':'')+'" href="daily.html?date='+r.date+'">'+
        '<div style="min-width:0;flex:1;">'+
          '<div class="item-date">'+escHtml(r.label)+'</div>'+
          '<div class="item-sub">'+escHtml(r.sub)+'</div>'+
          '<div class="item-tags">'+tags+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">'+
          (r.new?'<span class="badge-new">NEW</span>':'')+
          '<span class="badge-link">보기 →</span>'+
        '</div>'+
      '</a>';
    }).join('');
  } catch(e){
    list.innerHTML = '<div class="empty">리포트 목록을 불러올 수 없습니다.<br>'+escHtml(e.message)+'</div>';
  }
}

/* ───────── 즐겨찾기 탭 (날짜별 분리) ───────── */
function renderFavs(){
  var allFavs = getAllFavs();
  var allMeta = getAllMeta();
  var allMemos = getAllMemos();
  var container = document.getElementById('fav-list');

  // (date, ticker) 평면 리스트
  var entries = [];
  Object.keys(allFavs).forEach(function(d){
    Object.keys(allFavs[d]||{}).forEach(function(t){
      if(allFavs[d][t]){
        entries.push({
          date: d,
          ticker: t,
          meta: (allMeta[d]||{})[t] || {},
          memo: (allMemos[d]||{})[t] || ''
        });
      }
    });
  });
  updateFavCount();

  if(entries.length===0){
    container.innerHTML = '<div class="fav-empty"><div class="big">⭐</div>즐겨찾기한 종목이 없습니다.<br>각 일자 리포트에서 종목명 옆 ☆ 버튼을 눌러 추가하세요.</div>';
    return;
  }

  var q = (document.getElementById('fav-search')||{}).value || '';
  q = q.trim().toLowerCase();
  if(q){
    entries = entries.filter(function(e){
      var name = (e.meta.name||'').toLowerCase();
      return name.includes(q) || e.ticker.toLowerCase().includes(q);
    });
  }

  if(entries.length===0){
    container.innerHTML = '<div class="fav-empty"><div class="big">🔍</div>"'+escHtml(q)+'" 검색 결과가 없습니다.</div>';
    return;
  }

  // 날짜별 그룹핑
  var byDate = {};
  entries.forEach(function(e){
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });
  var sortedDates = Object.keys(byDate).sort(function(a,b){return b.localeCompare(a);});

  var html = '';
  sortedDates.forEach(function(date){
    var dateLabel = date==='날짜 미상' ? '날짜 미상'
      : date.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$1년 $2월 $3일');
    html += '<div class="date-section-label">📅 '+dateLabel+' ('+byDate[date].length+')</div>';

    byDate[date].forEach(function(e){
      var c = e.ticker;
      var meta = e.meta;
      var name = meta.name || c;
      var cr = (meta.change_rate==null) ? null : Number(meta.change_rate);
      var sigCls = cr==null ? 'fav-sig neutral' : (cr>=0 ? 'fav-sig' : 'fav-sig down');
      var sigLabel = cr==null ? '-' : ((cr>=0?'+':'')+cr+'%');
      var memoVal = e.memo;
      var dailyUrl = (date!=='날짜 미상') ? 'daily.html?date='+date+'#stock-'+c : '#';
      var dateAttr = escHtml(date);

      html += '<div class="fav-card">'+
        '<div class="fav-card-top">'+
          '<div class="fav-info">'+
            '<a class="fav-name" href="'+dailyUrl+'">⭐ '+escHtml(name)+'</a>'+
            '<div class="fav-meta">'+
              '<span style="font-family:Inter;font-size:11px;color:#a8a29e;">'+escHtml(c)+'</span>'+
              (meta.market?'<span style="font-size:11px;color:#64748b;">'+escHtml(meta.market)+'</span>':'')+
              '<span class="'+sigCls+'">'+sigLabel+'</span>'+
              (meta.price?'<span style="font-size:11px;color:#64748b;">'+meta.price.toLocaleString()+'원</span>':'')+
            '</div>'+
          '</div>'+
          '<div class="fav-actions">'+
            '<a class="fav-link" href="'+dailyUrl+'">상세 →</a>'+
            '<a class="fav-link naver" href="https://m.stock.naver.com/domestic/stock/'+c+'/total" target="_blank" rel="noopener">📊</a>'+
            '<a class="fav-link dart" href="'+dartUrl(name)+'" target="_blank" rel="noopener">🗂</a>'+
            '<button class="fav-remove" onclick="removeFav(\''+c+'\',\''+dateAttr+'\')" title="이 일자 즐겨찾기 해제">☆</button>'+
          '</div>'+
        '</div>'+
        '<textarea class="fav-memo" rows="1" placeholder="✏️ 메모 (자동저장)" '+
          'oninput="this.style.height=\'auto\';this.style.height=this.scrollHeight+\'px\';saveMemo(\''+c+'\',this.value,\''+dateAttr+'\')" '+
          'onchange="saveMemo(\''+c+'\',this.value,\''+dateAttr+'\')">'+escHtml(memoVal)+'</textarea>'+
      '</div>';
    });
  });

  container.innerHTML = html;
  container.querySelectorAll('.fav-memo').forEach(function(ta){
    if(ta.value){ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; }
  });
}

function saveMemo(code, val, date){
  if(!date) return;
  var all = getAllMemos();
  var m = all[date] ? Object.assign({}, all[date]) : {};
  if((val||'').trim()) m[code] = val;
  else delete m[code];
  if(Object.keys(m).length>0) all[date]=m; else delete all[date];
  saveAllMemos(all);
  localStorage.setItem('screener_fav_ts', Date.now());
}

function removeFav(code, date){
  if(!date) return;
  var allF = getAllFavs(), allM = getAllMeta(), allMemos = getAllMemos();
  if(allF[date]){ delete allF[date][code]; if(Object.keys(allF[date]).length===0) delete allF[date]; }
  if(allM[date]){ delete allM[date][code]; if(Object.keys(allM[date]).length===0) delete allM[date]; }
  if(allMemos[date]){ delete allMemos[date][code]; if(Object.keys(allMemos[date]).length===0) delete allMemos[date]; }
  saveAllFavs(allF); saveAllMeta(allM); saveAllMemos(allMemos);
  localStorage.setItem('screener_fav_ts', Date.now());
  updateFavCount();
  renderFavs();
}

function clearAllFavs(){
  if(!confirm('모든 일자의 즐겨찾기를 초기화할까요?\n메모도 함께 삭제됩니다.')) return;
  localStorage.removeItem(LS_FAVS_V2);
  localStorage.removeItem(LS_META_V2);
  localStorage.removeItem(LS_MEMOS_V2);
  // 레거시 키도 함께 제거
  localStorage.removeItem(LS_FAVS_LEGACY);
  localStorage.removeItem(LS_META_LEGACY);
  localStorage.removeItem(LS_MEMOS_LEGACY);
  // 빈 v2 객체로 재초기화 (다음 마이그레이션 트리거 방지)
  saveAllFavs({});
  localStorage.setItem('screener_fav_ts', Date.now());
  updateFavCount();
  renderFavs();
}

/* ───────── GitHub 동기화 ───────── */
const GH_SYNC = { OWNER:'whysosary-dot', REPO:'invest-private', PATH:'screener/screener_favs.json', BRANCH:'main' }; // 비공개 데이터 리포
const LS_PAT_KEY = 'screener_gh_pat';
const LS_TS_KEY = 'screener_fav_ts';

function getPatFromLS(){ return localStorage.getItem(LS_PAT_KEY)||localStorage.getItem('sv_github_pat')||''; }
function savePatToLS(p){ localStorage.setItem(LS_PAT_KEY, p); }

function toast(msg, ok){
  if(ok===undefined) ok=true;
  var t=document.getElementById('gh-toast');
  if(!t) return;
  t.textContent=msg;
  t.style.background=ok?'#22c55e':'#ef4444';
  t.style.display='block';
  t.style.opacity='1';
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){ t.style.display='none'; },400); },3000);
}

async function ghApiGet(path){
  var pat=getPatFromLS();
  if(!pat) return null;
  var url='https://api.github.com/repos/'+GH_SYNC.OWNER+'/'+GH_SYNC.REPO+'/contents/'+path+'?ref='+GH_SYNC.BRANCH;
  var r=await fetch(url,{headers:{'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json'}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GH GET '+r.status);
  return r.json();
}

async function ghApiPut(path, contentB64, sha, message){
  var pat=getPatFromLS();
  if(!pat) throw new Error('PAT 없음');
  var url='https://api.github.com/repos/'+GH_SYNC.OWNER+'/'+GH_SYNC.REPO+'/contents/'+path;
  var body={message:message, content:contentB64, branch:GH_SYNC.BRANCH};
  if(sha) body.sha=sha;
  var r=await fetch(url,{method:'PUT',headers:{'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){ var e=await r.json(); throw new Error(e.message||'GH PUT '+r.status); }
  return r.json();
}

function _migrateFlatToNested(flatFavs, flatMeta, flatMemos){
  var favsV2={}, metaV2={}, memosV2={};
  Object.keys(flatFavs||{}).forEach(function(ticker){
    if(!flatFavs[ticker]) return;
    var d = (flatMeta && flatMeta[ticker] && flatMeta[ticker].date) || '날짜 미상';
    if(!favsV2[d]) favsV2[d]={};
    favsV2[d][ticker] = true;
    if(flatMeta && flatMeta[ticker]){
      if(!metaV2[d]) metaV2[d]={};
      metaV2[d][ticker] = flatMeta[ticker];
    }
    if(flatMemos && flatMemos[ticker]){
      if(!memosV2[d]) memosV2[d]={};
      memosV2[d][ticker] = flatMemos[ticker];
    }
  });
  return {favs:favsV2, meta:metaV2, memos:memosV2};
}

async function ghCommitFavsCore(){
  if(!getPatFromLS()) throw new Error('PAT 미설정');
  var favsV2=getAllFavs(), metaV2=getAllMeta(), memosV2=getAllMemos();
  var now=Date.now();
  var payload=JSON.stringify({
    schema: 2,
    favs_v2: favsV2,
    meta_v2: metaV2,
    memos_v2: memosV2,
    favs: {}, meta: {}, memos: {},
    updatedAt: now
  }, null, 2);
  var b64=btoa(unescape(encodeURIComponent(payload)));
  var existing=await ghApiGet(GH_SYNC.PATH);
  var sha=existing?existing.sha:undefined;
  await ghApiPut(GH_SYNC.PATH, b64, sha, '⭐ 즐겨찾기 동기화 (날짜별)');
  localStorage.setItem(LS_TS_KEY, now);
}

async function ghCommitFavs(){
  if(!confirm('즐겨찾기·메모를 GitHub에 저장할까요?\n모든 기기의 데이터가 현재 기기 기준으로 덮어씌워집니다.')) return;
  var pat=getPatFromLS();
  if(!pat){ openPatModal(); return; }
  var btn=document.getElementById('gh-commit-btn');
  if(btn){ btn.disabled=true; btn.textContent='⏳ 저장 중...'; }
  try {
    await ghCommitFavsCore();
    toast('✅ GitHub에 저장됐어요!');
  } catch(e){
    toast('❌ '+e.message, false);
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='☁️ 커밋 & 푸시'; }
  }
}

/* ── Stock Valuation 대시보드 통합 커밋 (iframe 내장 시) ── */
(function(){
  if (window.self === window.top) return;
  // 대시보드 탭 안에서는 자체 커밋 버튼 숨김 (통합 버튼으로 일원화)
  var _b=document.getElementById('gh-commit-btn'); if(_b) _b.style.display='none';
  window.addEventListener('message', async function(e){
    if (e.origin !== 'https://whysosary-dot.github.io' || !e.data || !e.data.type) return;
    if (e.data.type === 'sv-ping'){ e.source.postMessage({type:'sv-pong', repo:'stock-screener'}, e.origin); return; }
    if (e.data.type !== 'sv-commit') return;
    var ok=true, msg='커밋 완료';
    try { await ghCommitFavsCore(); }
    catch(err){ ok=false; msg=err.message||String(err); }
    e.source.postMessage({type:'sv-commit-result', repo:'stock-screener', ok:ok, msg:msg}, e.origin);
  });
})();

async function loadFavsFromGitHub(){
  var pat=getPatFromLS();
  if(!pat) return;
  try {
    var localTotal = 0;
    var _af = getAllFavs();
    Object.keys(_af).forEach(function(d){ localTotal += Object.keys(_af[d]||{}).length; });
    if(localTotal>0 && !localStorage.getItem(LS_TS_KEY)){
      localStorage.setItem(LS_TS_KEY, Date.now());
    }
    var localTs=parseInt(localStorage.getItem(LS_TS_KEY)||'0',10);
    var file=await ghApiGet(GH_SYNC.PATH);
    if(!file) return;
    var data=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,'')))));
    var ghTs=data.updatedAt||0;
    if(ghTs<=localTs) return;

    var favsV2, metaV2, memosV2;
    if(data.schema === 2 || data.favs_v2){
      favsV2 = data.favs_v2 || {};
      metaV2 = data.meta_v2 || {};
      memosV2 = data.memos_v2 || {};
    } else if(data.favs){
      var mig = _migrateFlatToNested(data.favs, data.meta, data.memos);
      favsV2 = mig.favs; metaV2 = mig.meta; memosV2 = mig.memos;
    } else { return; }
    saveAllFavs(favsV2);
    saveAllMeta(metaV2);
    saveAllMemos(memosV2);
    localStorage.setItem(LS_TS_KEY, ghTs);
    updateFavCount();
    if(document.getElementById('tab-favs').classList.contains('active')) renderFavs();
    toast('☁️ GitHub에서 동기화됨');
  } catch(e){ console.warn('GH load fail:', e); }
}

function openPatModal(){
  document.getElementById('pat-modal-overlay').style.display='flex';
  document.getElementById('pat-input').value=getPatFromLS();
}
function closePatModal(){ document.getElementById('pat-modal-overlay').style.display='none'; }
function savePatAndClose(){
  var v=document.getElementById('pat-input').value.trim();
  if(!v){ toast('PAT를 입력하세요', false); return; }
  savePatToLS(v);
  closePatModal();
  toast('✅ PAT 저장됨 — 이제 ☁️ 커밋 & 푸시를 사용할 수 있어요');
  loadFavsFromGitHub();
}

document.addEventListener('DOMContentLoaded', function(){
  updateFavCount();
  loadReports();
  loadFavsFromGitHub();
});
</script>
